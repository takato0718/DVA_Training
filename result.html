<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>結果 - 速読トレーニング</title>
    <link rel="icon" href="images/favicon.png" type="image/png">

    <!-- OGP設定 -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="動体視力トレーニング">
    <meta property="og:description" content="動体視力を鍛えられるゲームです！">
    <meta property="og:url" content="https://あなたのサイトURL.com/">
    <meta property="og:image" content="https://あなたのサイトURL.com/images/ogp.png">
    <meta property="og:site_name" content="動体視力トレーニング">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="動体視力トレーニング">
    <meta name="twitter:description" content="動体視力を鍛えられるゲームです！">
    <meta name="twitter:image" content="https://あなたのサイトURL.com/images/ogp.png">

    <!-- 外部CSSファイルを読み込む -->
    <link rel="stylesheet" href="result.css">
</head>
<body>
    <div class="result-container">
        <h1>結果発表</h1>
        
        <div class="score-display">
            <div class="score-label">正解数</div>
            <div class="score-number" id="score">0</div>
            <div class="score-label" id="total">/ 10問</div>
        </div>

        <div class="result-message" id="message"></div>

        <div class="result-details">
            <div class="detail-item">
                <span class="detail-label">総問題数</span>
                <span class="detail-value" id="total-questions">10問</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">正解数</span>
                <span class="detail-value" id="correct-count">0問</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">不正解数</span>
                <span class="detail-value" id="incorrect-count">0問</span>
            </div>
        </div>

        <div class="button-container">
            <div class="button-row">
                <a href="game.html" class="button retry-button">もう一度挑戦</a>
                <a href="index.html" class="button home-button">スタート画面へ</a>
            </div>
            <div class="button-row">
                <button id="twitter-share-button" class="button twitter-button">
                    <span class="twitter-icon"></span> Twitterでシェア
                </button>
            </div>
        </div>
    </div>

    <script src="result.js"></script>
</body>
</html>
